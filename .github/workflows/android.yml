name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'آدرس سرور (اختیاری) مثل https://chat.example.ir/'
        required: false
        default: ''
      app_name:
        description: 'نام برنامه'
        required: false
        default: 'تل‌چت'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "TELCHAT_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          TELCHAT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TELCHAT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TELCHAT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -z "$TELCHAT_KEYSTORE_PASSWORD" ] && unset TELCHAT_KEYSTORE_PASSWORD TELCHAT_KEY_ALIAS TELCHAT_KEY_PASSWORD
          gradle -p android assembleRelease --no-daemon --stacktrace \
            -PserverUrl="${{ github.event.inputs.server_url }}" \
            -PappName="${{ github.event.inputs.app_name || 'تل‌چت' }}"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/telchat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: telchat-apk
          path: out/telchat.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Android APK ${{ github.run_number }}
          body: |
            فایل telchat.apk را دانلود کنید و در پوشه download روی هاست خود قرار دهید تا کاربران بتوانند از داخل برنامه آن را دانلود کنند.
          files: out/telchat.apk
